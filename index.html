res:()=>{const r=T.edit?S.r:{brgy:'Guinsorongan',city:'Catbalogan City',prov:'Samar',type:''};return pg(T.edit?'Update Residency':'Register Your Residency',T.edit?"go('rs')":"go('personal')",(T.edit?msg('wa','Barangay note: '+(S.r.note||'please complete your purok/street in the address.')):'')+sel('adp','Purok',PUROKS,PUROKS.includes(pkOf({ad:r.addr}))?pkOf({ad:r.addr}):PUROKS[0])+inp('ad','Street / House No.',stOf({ad:r.addr}),'text','e.g. Rizal Street')+inp('br','Barangay',r.brgy)+inp('ct','Municipality/City',r.city)+inp('pv','Province',r.prov)+sel('rt','Residency Status',['Resident of this Barangay','New Resident','Transferred from Another Barangay','Informal Settler'],r.type,'xf()')+'<div id=ex></div>'+msg('in','Only the information needed for verification is collected.')+`<button class=btn onclick="sr()">Submit Registration</button>`)},
conf:()=>`<div class="v ctr"><div style="font-size:60px">✅</div><h1>Registration Submitted</h1><div class=card style="width:100%">${row('Reference No.',S.r.ref)}${row('Status',bd('PENDING VERIFICATION'))}</div><p>Your residency information has been submitted for barangay verification.</p><button class=btn onclick="go('rs')">VIEW STATUS</button><button class="btn sec" onclick="go('login')">GO TO HOME</button></div>`,
login:()=>pg('Log In','',`<div class=ctr style="margin:10px"><img class=logo src="${LOGO}" style="width:90px;height:90px"></div>`+inp('lm','Mobile Number',S.u.mobile,'tel')+inp('lp','Password','','password')+`<button class=btn onclick="li()">LOG IN</button><button class="btn sec" onclick="lo()">USE OTP INSTEAD</button><button class="btn sec" onclick="TMP={};go('create')">CREATE ACCOUNT</button><p style="text-align:center;margin-top:14px"><a href="#" onclick="al('Prototype: a password reset code would be sent by SMS.');return false">Forgot password?</a></p>${msg('wa','Resident demo: 09171234567 / password')}${msg('in','Staff demo: admin 09170000001 / admin123 · kagawad 09170000002 / staff123 · employee 09170000003 / staff123 · Punong Barangay 09170000004 / punong123 · SK Chairperson 09170000005 / staff123 · Treasurer 09170000006 / staff123')}`),
home:()=>{const h=new Date().getHours(),first=np(S.u).fn||S.u.name,ok=S.st=='verified';return `<div class=hd>${hav()}<div style="flex:1"><h2>${h<12?'Maupay nga Aga':h<18?'Maupay na Kulop':'Maupay na Gab-i'}, ${first}!</h2><small>Barangay ${S.r.brgy}</small></div><span onclick="go('notifs')">🔔</span><span onclick="go('profile')">👤</span></div><div class=v><div class=card onclick="go('rs')" style="cursor:pointer;border-left:5px solid var(--${ok?'ok':S.st=='pending'?'wa':'er'})"><small>Resident Status</small><div style="margin:6px 0">${bd(ok?'✓ Verified Resident':STL[S.st])}</div>${ok?'':`<small>${S.st=='pending'?'Services unlock once the barangay verifies your residency.':'Tap to update your information.'}</small>`}</div>${annB()}<h3>Barangay Services</h3><div class=g>${SV.map(s=>`<div class="sv ${s[3]&&!ok?'lk':''}" onclick="sg('${s[2]}',${s[3]})"><span>${s[1]}</span>${s[0]}${s[3]&&!ok?' 🔒':''}</div>`).join('')}</div><h3>Recent Requests</h3>${S.q.slice(0,2).map(rc).join('')||empty('🗂️','No requests yet')}</div>`},
svc:()=>pg('Barangay Services','',SV.filter(s=>s[2]!='reqs').map(s=>`<div class="card rq ${s[3]&&S.st!='verified'?'lk':''}" onclick="sg('${s[2]}',${s[3]})"><div style="font-size:28px">${s[1]}</div><div style="flex:1"><b>${s[0]}</b><small>${s[4]}</small></div>${s[3]&&S.st!='verified'?'🔒':'›'}</div>`).join('')),
ok:()=>{const q=gq(T.p),c=q.t=='Complaint';return `<div class="v ctr"><div style="font-size:60px">✅</div><h1>${c?'Complaint':'Request'} Submitted Successfully</h1><div class=card style="width:100%;text-align:left">${row('Reference No.',q.ref)}${row('Status',bd(ST[q.t][0].toUpperCase()))}${row('Date Submitted',q.d)}${row(c?'Category':'Type',c?q.cat:q.sub)}</div><button class=btn onclick="go('track','${q.ref}')">TRACK ${c?'COMPLAINT':'REQUEST'}</button><button class="btn sec" onclick="go('home')">BACK TO HOME</button></div>`},
track:()=>{const q=gq(T.p),c=q.t=='Complaint';return pg(c?'Complaint Tracking':'Request Status',"go('reqs')",`<div class=card>${row('Reference No.',q.ref)}${row(c?'Category':'Certificate Type',c?q.cat:q.sub)}${c?row('Subject',q.sub):row('Purpose',q.cat)}${row(c?'Date Submitted':'Date Requested',q.d)}${row('Current Status',bd(stl(q)))}${q.as?row('Assigned To',q.as):''}${q.ab?row('Assisted by',q.ab.n+(q.ab.a?' (Acting Administrator)':'')):''}${q.rb?row('Released by',q.rb.n+' · '+q.rd):''}${q.pay?row('Fee',q.pay.st=='Paid'?'Paid '+php(q.pay.amt)+' · OR '+(q.pay.orn||'—'):'Free of charge'):''}</div>${q.f?`<div class=card><b>Submitted Information</b>${q.f.map(a=>row(a[0],a[1])).join('')}</div>`:''}<div class=card><b>Progress</b><div class=tl>${ST[q.t].map((x,i)=>`<div class="${i<q.s?'done':i==q.s?'cur':''}"><i>${i<q.s?'✓':i==q.s?'●':'○'}</i>${x}</div>`).join('')}</div></div><div class=card><small>Latest Update</small><p style="color:var(--tx);margin-top:4px">${q.rm||UP[q.t][q.s]}</p></div>${logC(q)}${act(q)}${q.s<4?`<button class="btn sec" onclick="adv('${q.ref}')">Demo: advance status (simulate staff action)</button>`:''}`)},
clf:()=>pg('Request Barangay Clearance',"go('svc')",sel('ct1','Clearance Type',['Barangay Clearance','Business Clearance','Certificate of Residency'])+sel('pu','Purpose',['Employment','Travel / Passport','School Requirement','Business Permit','Other'])+inp('ca','Address',S.r.addr+', '+S.r.brgy)+`<label>Additional Information</label><textarea id=ci></textarea><button class=btn onclick="scl()">Submit Request</button>`),
vt:()=>pg('Voter Information',"go('svc')",`<div class=card>${row('Voter Status',bd(S.vt=='Not Registered'?'Not Registered':'Registered'))}${row('Barangay',S.r.brgy)}${row('Voter Category',S.vt)}</div>${msg('in','Only your voter status and category are shown here.')}`+sel('vs','Prototype: preview another category',['Registered Voter','Not Registered','Transferred Voter','Voter from Another Barangay'],S.vt,"S.vt=v('vs');save();go('vt')")),
bl:()=>pg('Blotter / Summons',"go('svc')",`<div class=card><div class=rq style="cursor:default"><div><b>Mediation Notice</b><small>BLT-2026-0003 · Oct 3, 2026, 9:00 AM</small><small>Barangay Hall</small></div>${bd('Scheduled')}</div></div>${msg('in','Only records where you are a named party appear here. Records cannot be edited or deleted; please visit the Barangay Hall for concerns.')}`),
reqs:()=>pg('My Requests','',`<input id=sq placeholder="Search by reference number" value="${F.q}" oninput="F.q=this.value;$('#rl').innerHTML=rl()"><div class=g style="margin-top:8px"><select id=sf onchange="F.sv=this.value;$('#rl').innerHTML=rl()">${['All','Complaint','Clearance'].map(x=>`<option value="${x}" ${x==F.sv?'selected':''}>${x=='Clearance'?'Certificates':x}</option>`).join('')}</select><input type=date value="${F.d}" onchange="F.d=this.value;$('#rl').innerHTML=rl()"></div><div class=tabs>${['ALL','PENDING','PROCESSING','COMPLETED'].map(t=>`<b class="${F.tab==t?'on':''}" onclick="F.tab='${t}';render()">${t}</b>`).join('')}</div><div id=rl>${rl()}</div>`),
notifs:()=>pg('Notifications','',annL()+(S.n.length?`<small style="cursor:pointer;color:var(--p)" onclick="S.n.forEach(n=>n.u=0);save();render()">Mark all as read</small><div style="height:8px"></div>`+S.n.map(n=>`<div class="card rq ${n.u?'un':''}" onclick="go('nd',${n.id})"><div style="font-size:24px">${n.ic}</div><div style="flex:1">${n.u?`<b>${n.ti}</b>`:n.ti}<small>${n.b}</small></div></div>`).join(''):empty('🔔','No notifications'))),
nd:()=>{const n=S.n.find(x=>x.id==T.p);n.u=0;save();return pg('Notification',"go('notifs')",`<div class=card><div style="font-size:36px">${n.ic}</div><h3>${n.ti}</h3><p style="color:var(--tx)">${n.b}</p></div>${n.g?`<button class=btn onclick="${n.g}">View Details</button>`:''}`)},
profile:()=>pg('Profile','',`${avt()}<h3 style="text-align:center;margin:0">${S.u.name}</h3><p style="text-align:center;margin-bottom:12px">${S.u.mobile}</p><div class=card>${row('Resident Status',bd(STL[S.st]))}${row('Barangay',S.r.brgy)}${row('Address',S.r.addr)}${ageOf(S.u.dob)>=60?row('Senior Citizen','Yes'):''}${S.u.pwd?row('PWD','Yes'):''}</div><div class=card style="padding:0 14px">${[['Personal Information',"go('pi')"],['My Role & Permissions',"go('perm')"],['Residency Information',"go('rs')"],['Security',"go('inf','Change Password')"],['Notification Settings',"go('inf','Notification Settings')"],['Privacy',"go('inf','Privacy Information')"],['Help',"go('inf','Help')"],['Settings',"go('set')"]].map(m=>`<div class=mn onclick="${m[1]}">${m[0]}<span>›</span></div>`).join('')}<div class=mn style="color:var(--er)" onclick="lg()">Log Out</div></div>`),
pi:()=>pg('Personal Information',"go('profile')",inp('fn','First Name',np(S.u).fn)+inp('mn','Middle Name or Initial (Optional)',np(S.u).mn)+inp('ln','Last Name',np(S.u).ln)+inp('db','Date of Birth',S.u.dob,'date').replace('<input','<input onchange=dyn()')+sel('sx','Sex',['Female','Male'],S.u.sex)+sel('cv','Civil Status',['Single','Married','Widow/Widower','Single Parent'],S.u.civil)+'<div id=yx></div>'+inp('em','Email (Optional)',S.u.email)+`<label>Mobile Number <span class="bd ok">✓ Verified</span></label><input value="${S.u.mobile}" readonly><button class="btn sec" onclick="go('cm')">Change Mobile Number (OTP required)</button><button class=btn onclick="Object.assign(S.u,{name:nmf(),fn:v('fn').trim(),mn:v('mn').trim(),ln:v('ln').trim(),dob:v('db'),sex:v('sx'),civil:v('cv'),email:v('em'),...dv()});save();al('Saved.')">Save Changes</button>`),
rs:()=>{const r=S.r,st=S.st;return pg('Residency Status',S.in?"go('profile')":"go('login')",`<div class=card style="text-align:center">${bd(STL[st])}<p style="margin-top:8px">${st=='verified'?'You may now use all barangay services.':st=='pending'?'Your registration is waiting for barangay verification.':st=='declined'?'Your registration was declined. Please visit the Barangay Hall.':'Please update your information and resubmit.'}</p></div>${st=='corr'||st=='declined'?msg('er','Barangay note: '+(r.note||'please complete your purok/street in the address.'))+(st=='corr'?`<button class=btn onclick="go('res',0,1)">Update Information</button>`:''):''}<div class=card>${row('Reference No.',r.ref)}${row('Category',r.type)}${row('Address',r.addr)}${row('Barangay',r.brgy)}${row('City / Province',r.city+', '+r.prov)}${Object.entries(r.x||{}).filter(a=>a[1]).map(a=>row({pb:'Previous Barangay',pm:'Previous City',pp:'Previous Province',ls:'Length of Stay',rr:'Reason for Stay'}[a[0]],a[1])).join('')}</div><small>Prototype: simulate the barangay's decision</small><div class=g><button class="btn sec" onclick="ss('verified')">Approve</button><button class="btn sec" onclick="ss('corr')">Needs Correction</button></div><button class="btn sec" onclick="ss('pending')">Set Pending</button>`)},
set:()=>pg('Settings',"go('profile')",`<div class="card" style="padding:0 14px">${['Change Password','OTP Security','Notification Settings','Privacy Information','Data Privacy Notice','UI States (prototype)'].map(m=>`<div class=mn onclick="go('${m[0]=='U'?'ui':'inf'}','${m}')">${m}<span>›</span></div>`).join('')}<div class=mn style="color:var(--er)" onclick="lg()">Log Out</div><div class=mn onclick="box('Reset all demo data?',()=>{localStorage.clear();S=seed();go('welcome')})">Reset demo data</div></div>`),
inf:()=>{const k=T.p,B={'Change Password':inp('op','Current Password','','password')+inp('np','New Password','','password')+`<button class=btn onclick="v('np').length<6?al('New password must be at least 6 characters.'):v('op')!=S.u.pw?al('Current password is incorrect.'):(S.u.pw=v('np'),save(),al('Password changed.'))">Update Password</button>`,'OTP Security':msg('in','Ask for an OTP at every login (simulated).')+`<label><input type=checkbox style="width:auto" checked> Require OTP on new device</label>`,'Notification Settings':['Request updates','Residency updates','Barangay announcements'].map(x=>`<label><input type=checkbox style="width:auto" checked> ${x}</label>`).join(''),'Privacy Information':msg('in','Only barangay staff assigned to your request can view your records.'),'Data Privacy Notice':`<p>SBISP collects only the personal data needed to verify residency and process barangay requests, in line with the Data Privacy Act of 2012 (RA 10173). This prototype uses fictional data stored only in your browser.</p>`,'Help':`<p>Visit the Barangay Hall during office hours or contact the barangay secretary. (Placeholder text for the prototype.)</p>`};return pg(k,"go('"+(k=='Help'||k=='Privacy Information'?'profile':'set')+"')",`<div class=card>${B[k]||B['Privacy Information']}</div>`)},
ui:()=>pg('UI States',"go('set')",msg('ok','Success message')+msg('er','Error message')+msg('wa','Warning message')+msg('in','Confirmation message')+msg('pe','Pending message')+empty('📭','No complaints')+empty('🗂️','No requests')+empty('🔔','No notifications')+empty('🔍','No search results'))};
const SV=[['Complaints','📢','cf',1,'Report a concern in your barangay'],['Certificates','📄','cl',1,'Clearances and certifications'],['Residency','🏠','rs',0,'View your residency status'],['Voter Information','🗳️','vt',1,'Check your voter status'],['Blotter / Summons','📋','bl',1,'View notices where you are a party'],['My Requests','🗂️','reqs',0,'Track all your requests']];
/* ===== LOGIC ===== */
const gq=r=>S.q.find(x=>x.ref==r);
const rc=q=>`<div class="card rq" onclick="go('track','${q.ref}')"><div><b>${q.t=='Clearance'?q.sub:TT[q.t]}</b><small>${q.ref} · ${q.d}</small></div>${bd(stl(q))}</div>`;
const grp=s=>s==0?'PENDING':s==4?'COMPLETED':'PROCESSING';
function rl(){const l=S.q.filter(q=>(F.tab=='ALL'||grp(q.s)==F.tab)&&(F.sv=='All'||q.t==F.sv)&&q.ref.toLowerCase().includes(F.q.toLowerCase())&&(!F.d||q.d>=F.d));return l.map(rc).join('')||empty(S.q.length?'🔍':'🗂️',S.q.length?'No search results':'No requests')}
function sg(s,g,p){if(g&&S.st!='verified')return al('Residency verification is required before you can use this service. Check your residency status on the Home screen.');go(s,p)}
function c1(){if(!/^09\d{9}$/.test(v('mb')))return al('Enter a valid 11-digit mobile number (09XXXXXXXXX).');if(v('pw').length<6)return al('Password must be at least 6 characters.');TMP={mobile:v('mb'),pw:v('pw')};go('otp')}
function lo(){if(v('lm')!=S.u.mobile)return al('Enter the registered mobile number first.');TMP={mobile:v('lm'),login:1};go('otp')}
function ob(e){e.value=e.value.replace(/\D/g,'');if(e.value&&e.nextElementSibling)e.nextElementSibling.focus()}
function tick(){clearInterval(iv);OT={l:30,x:0};iv=setInterval(()=>{OT.l--;const e=$('#tm');if(!e)return clearInterval(iv);if(OT.l<=0){OT.x=1;clearInterval(iv);e.textContent='Code expired';$('#rb').disabled=false}else e.textContent='Resend code in 00:'+String(OT.l).padStart(2,'0')},1000)}
function vo(){const c=[...document.querySelectorAll('.ob')].map(x=>x.value).join('');const m=$('#om');
if(OT.x)return m.innerHTML=msg('er','Code expired. Please request a new one.');if(c.length<6)return m.innerHTML=msg('wa','Enter all 6 digits.');if(c!='123456')return m.innerHTML=msg('er','Incorrect code. Please try again.');
m.innerHTML=msg('ok','Mobile number verified!');setTimeout(()=>{if(TMP.change=='staff'){aud('Changed mobile number');setAcc({mobile:TMP.mobile});go('macc');al('Mobile number updated and verified.')}else if(TMP.change){S.u.mobile=TMP.mobile;save();go('pi');al('Mobile number updated and verified.')}else if(TMP.login){S.in=true;save();go('home')}else go('personal')},700)}
function c2(){if(!v('fn').trim()||!v('ln').trim()||!v('db'))return fe();TMP.p={name:nmf(),fn:v('fn').trim(),mn:v('mn').trim(),ln:v('ln').trim(),dob:v('db'),sex:v('sx'),civil:v('cv'),email:v('em'),...dv()};go('res')}
function xf(){const t=v('rt'),x=T.edit?(S.r.x||{}):{};$('#ex').innerHTML=t=='Transferred from Another Barangay'?inp('pb','Previous Barangay',x.pb)+inp('pm','Previous Municipality/City',x.pm)+inp('pp','Previous Province',x.pp):t=='Informal Settler'?inp('ls','Length of Stay',x.ls,'text','e.g. 3 years')+inp('rr','Reason for Stay',x.rr):''}
function sr(){if(!v('ad')||!v('br')||!v('ct')||!v('pv'))return fe();const x={};['pb','pm','pp','ls','rr'].forEach(k=>$('#'+k)&&(x[k]=v(k)));
const r={addr:v('adp')+', '+v('ad').trim(),brgy:v('br'),city:v('ct'),prov:v('pv'),type:v('rt'),x,ref:T.edit?S.r.ref:'REG-2026-0001'};
if(!T.edit){const k={ann:S.ann,fee:S.fee,acc:S.acc,oq:S.oq,bt:S.bt,pop:S.pop,off:S.off,dl:S.dl,tx:S.tx,act:S.act,aud:S.aud,rs:S.rs.filter(e=>!e.me)};S=seed();Object.assign(S,k);S.rs.unshift({id:Date.now(),me:1});S.u={...TMP.p,mobile:TMP.mobile,pw:TMP.pw};S.q=[];S.n=[]}
S.r=r;S.st='pending';S.n.unshift({id:Date.now(),ic:'⏳',ti:'Registration submitted',b:r.ref+' is pending barangay verification.',u:1,g:"go('rs')"});save();go(T.edit?'rs':'conf')}
function li(){const a=S.acc.find(x=>x.mobile==v('lm')&&x.pw==v('lp'));if(a&&a.active===false)return al('This account is deactivated. Please contact the Administrator or the Punong Barangay.');if(a){ME=actF(a);a.last=new Date().toISOString();aud('Logged in');save();A.tab='';return go('adm')}if(v('lm')==S.u.mobile&&v('lp')==S.u.pw){S.in=true;save();go('home')}else al('Incorrect mobile number or password.')}
function lg(){box('Are you sure you want to log out?',()=>{S.in=false;save();go('welcome')},'LOG OUT')}
function ss(s){S.st=s;const m={verified:['✅','Residency verified','Your residency was verified.'],corr:['⚠️','Residency needs correction','Please update your residency information.'],pending:['⏳','Pending verification','Your registration is pending.'],declined:['❌','Registration declined','Please visit the Barangay Hall.']}[s];S.n.unshift({id:Date.now(),ic:m[0],ti:m[1],b:m[2],u:1,g:"go('rs')"});save();render()}
function addReq(t,sub,cat,x,f,raw){const p=t=='Complaint'?'CMP':'CLR',n=Math.max(0,...S.q.filter(q=>q.t==t).map(q=>+q.ref.slice(-4)))+1,ref=`${p}-2026-${P(n)}`;S.q.unshift({ref,t,sub,d:today(),s:0,cat,x,f,raw});S.n.unshift({id:Date.now(),ic:'📝',ti:TT[t]+' submitted',b:ref+' was received.',u:1,g:`go('track','${ref}')`});save();go('ok',ref)}
function scl(){if(!v('ca'))return fe();box('Are you sure you want to submit this clearance request?',()=>addReq('Clearance',v('ct1'),v('pu'),v('ci')))}
function adv(r){const q=gq(r);q.s++;S.n.unshift({id:Date.now(),ic:'📝',ti:TT[q.t]+' status updated',b:`${r} is now ${ST[q.t][q.s]}.`,u:1,g:`go('track','${r}')`});save();render()}
/* ===== STAFF / ADMIN MODULE ===== */
const rv=e=>e.me?{...e,name:S.u.name,mobile:S.u.mobile,addr:S.r.addr,type:S.r.type,st:S.st,ref:S.r.ref,note:S.r.note,sid:S.u.sid,civil:S.u.civil,youth:S.u.youth,emp:S.u.emp,pen:S.u.pen,pwd:S.u.pwd,pwdid:S.u.pwdid,sk:S.u.sk}:e;

const MLT={'All living residents':()=>1,'Registered Voters':p=>p.vt[0]=='R','Non-registered Voters':p=>p.vt[0]=='N','Senior Citizens (60+)':(p,a)=>a>=60,'Persons with Disability (PWD)':p=>p.pwd,'Youth (15–30)':(p,a)=>a>=15&&a<=30,'In-School Youth':p=>p.sc=='In-School Youth','Out-of-School Youth':p=>p.sc=='Out-of-School Youth','Children (below 15)':(p,a)=>a<15,'Registered SK Voters':p=>p.sk=='Registered SK Voter','Social Pensioners (LGU)':p=>p.pen=='Social Pensioner of the LGU'||p.pen=='Both','SSS Pensioners':p=>p.pen=='SSS Pensioner'||p.pen=='Both','New Residents':p=>p.rt=='New Resident','Deceased':p=>p.dec};
function mlH(){const m=A.ml||{t:'Registered Voters',pk:''},rows=S.pop.filter(p=>(m.t=='Deceased'?p.dec:!p.dec)&&MLT[m.t](p,ageOf(p.bd))&&(!m.pk||pkOf(p)==m.pk)).sort((x,y)=>nk(x).localeCompare(nk(y)));
return RH('MASTERLIST',m.t+(m.pk?' · '+m.pk:' · All Puroks'))+TBL(['#','Name','Age','Sex','Address','Mobile','Notes'],rows.map((p,i)=>[i+1,p.ln+', '+p.fn+' '+(p.mn?p.mn[0]+'.':''),ageOf(p.bd),p.sx,pkOf(p)+', '+stOf(p),p.mb||'—',[p.cv,p.sc,p.sk,p.sid?'Senior ID '+p.sid:'',p.pwd?'PWD':''].filter(Boolean).join(', ')]))+`<p>Total: <b>${rows.length}</b></p>`+SIG()+FT()}
SC.ml=()=>{if(!ME||ME.role!='admin')return pg('Access Denied',"go('adm')",msg('er','Administrator group only.'));const m=A.ml||(A.ml={t:'Registered Voters',pk:''});return pg('Masterlists',"go('adm')",sel('mlt','List',Object.keys(MLT),m.t,'mlu()')+sel('mlp','Purok',['All Puroks',...PUROKS],m.pk||'All Puroks','mlu()')+`<div class="ct rp" style="margin-top:12px;overflow-x:auto">${mlH()}</div><button class=btn onclick="prx(mlH,'SBISP-Masterlist-'+A.ml.t.replace(/\W+/g,'_'))">🖨️ Print / Save as PDF</button>`+msg('in','Review the list above, then print it or save it as a PDF.'))};
function mlu(){A.ml={t:v('mlt'),pk:v('mlp')=='All Puroks'?'':v('mlp')};render()}
const hrL=()=>{const l=[...S.q,...S.oq,...S.bt].filter(q=>own2(q)&&q.hr&&q.hr.d>=today()&&!clo(q)).sort((a,b)=>(a.hr.d+(a.hr.t||'')).localeCompare(b.hr.d+(b.hr.t||'')));return l.length?`<div class=card><b>📅 Upcoming Hearings</b>${l.map(q=>`<div class=row style="display:block"><b>${q.hr.d} ${q.hr.t||''}</b><small>${q.ref} · ${q.sub} · ${q.hr.v||'Barangay Hall'}</small></div>`).join('')}</div>`:''};
render();
</script></body></html>
