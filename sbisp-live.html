<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SBISP – Smart Barangay Information and Service Portal</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet"><style>:root{--g1:#0F6B3A;--g2:#2BA95F;--mint:#E3F4E8;--bg:#F4F6FA;--ink:#14213D;--mut:#5b6b7f;--bad:#C0392B;--warn:#B7791F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#DDE5EE;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:center}
.phone{width:100%;max-width:390px;height:100%;max-height:844px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:500px){.phone{border-radius:28px;box-shadow:0 10px 40px #0003;height:844px}}
#app{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.top{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:20px;display:flex;align-items:center;gap:12px}
.top h1{font-size:21px}.top small{display:block;opacity:.9;font-size:14px;margin-top:2px}
.back{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;padding:0 6px 0 0}
.body{padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
.logo{width:128px;height:128px;border-radius:50%;box-shadow:0 4px 14px #0002;background:#fff}
.title{color:var(--g1);font-size:24px;font-weight:800;line-height:1.2}
.sub{color:var(--mut);font-size:15px}
.bar{width:160px;height:5px;background:#d5ecdc;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--g1);animation:ld 1.6s ease forwards}
@keyframes ld{to{width:100%}}
@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}#toast{transition:none}}
.btn{font:inherit;font-weight:700;letter-spacing:.3px;text-transform:uppercase;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:0;border-radius:12px;padding:16px;cursor:pointer;font-size:16px;width:100%}
.btn.alt{background:var(--mint);color:var(--g1)}
.btn.sm{padding:9px 14px;font-size:13px;width:auto;text-transform:none;border-radius:9px}
.btn.bad{background:var(--bad)}
.link{background:none;border:0;color:var(--g1);font:inherit;text-decoration:underline;cursor:pointer;font-size:15px}
form{display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.f input,.f select,.f textarea{font:inherit;font-weight:400;font-size:16px;padding:14px;border:1.5px solid #cfd8e6;border-radius:12px;background:#fff;color:var(--ink)}
:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.note{background:var(--mint);border-radius:12px;padding:12px 14px;font-size:14px}
.card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 1px 4px #0001}
.card h3{font-size:16px}.card p{font-size:14px;color:var(--mut);margin-top:3px}
.status{border-left:5px solid var(--g1)}
.h2{color:var(--g1);font-size:19px;font-weight:800;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:#fff;border:0;border-radius:14px;padding:18px 8px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 1px 4px #0001;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink)}
.tile b{font-size:34px;line-height:1}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;background:var(--mint);color:var(--g1);white-space:nowrap}
.pill.w{background:#F8EBCF;color:var(--warn)}.pill.b{background:#FADBD8;color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meta{font-size:13px;color:var(--mut);margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto}
.chip{border:0;border-radius:99px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;background:#fff;color:var(--ink);cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.tabs{display:flex;background:#fff;border-top:1px solid #e3e8f0}
.tab{flex:1;background:none;border:0;padding:8px 0 10px;font:inherit;font-size:11px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tab b{font-size:24px}.tab.on{color:var(--g1);font-weight:800}
.badge{position:absolute;top:2px;left:54%;background:#D92D20;color:#fff;border-radius:99px;font-size:11px;padding:1px 6px}
.unread{border-left:5px solid var(--g1)}
.err{color:var(--bad);font-size:14px}
#toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.av{width:96px;height:96px;border-radius:50%;background:var(--mint);color:var(--g1);font-size:48px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto}
.li{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eef1f6;font-size:16px;gap:12px;text-align:left}
.li span:first-child{color:var(--mut)}.li b{text-align:right}
.org{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:700}
.org small{display:block;font-weight:400;opacity:.9}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.og .card{border:2px solid #cfe9d8;text-align:center;font-size:14px}.og .card b{display:block}.og .card span{color:var(--mut);font-size:12px}
.cap{text-align:center;color:var(--g1);font-weight:800;font-size:13px;letter-spacing:1px;text-transform:uppercase}
</style></head><body><div class="phone"><div id="app"></div><div id="toast" role="status"></div></div><script>

otp:()=>`${top('Enter Code','Sent to '+esc(ui.tmp.mobile),ui.tmp.mode==='signup'?'register':'otplogin')}<div class="body"><form data-form="otp"><label class="f">6-digit code<input name="code" inputmode="numeric" maxlength="6" required autocomplete="one-time-code" style="text-align:center;letter-spacing:.4em;font-size:22px"></label>${errH()}<button class="btn">Confirm Code</button></form><button class="link" data-act="resend">Send a new code</button></div>`,
otplogin:()=>`${top('Log In with OTP',null,'login')}<div class="body"><form data-form="otplogin">${field('Mobile Number','mobile','tel','inputmode="numeric" maxlength="11" placeholder="09XXXXXXXXX"')}${errH()}<button class="btn">Send Code</button></form></div>`,
complaint:()=>`${top('Submit a Complaint',null,'home')}<div class="body"><form data-form="complaint">${sel('Complaint Category','cat',['Peace and Order','Garbage and Sanitation','Road and Streetlight','Noise','Water Supply','Other'])}${field('Subject','subject','text','maxlength="60"')}<label class="f">Description<textarea name="detail" rows="4" required></textarea></label>${field('Location','loc')}<label class="f">Date of Incident<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label>${errH()}<button class="btn">Submit Complaint</button></form></div>`,
residency:()=>`${top('Residency',null,'home')}<div class="body"><p>Staff compare your details with the barangay household list.</p><form data-form="residency">${field('Full name','name','text','autocomplete="name"')}${sel('Purok','purok',['Purok 1','Purok 2','Purok 3','Purok 4','Purok 5'])}${field('Street / House no.','street')}${sel('ID type','idType',['Voter’s ID','National ID','Driver’s License','Senior Citizen ID','School ID'])}${field('ID number','idNo')}${errH()}<button class="btn">Submit for Verification</button></form></div>`,
reqs:()=>`${top('My Requests')}<div class="body"><input id="q" class="f" style="font:inherit;font-size:16px;padding:14px;border:1.5px solid #cfd8e6;border-radius:12px" placeholder="Search by reference number" value="${esc(ui.q)}"><div class="chips">${['ALL','PENDING','PROCESSING','COMPLETED'].map(f=>`<button class="chip ${ui.filter===f?'on':''}" data-f="${f}">${f}</button>`).join('')}</div><div id="list" style="display:flex;flex-direction:column;gap:14px">${listHtml()}</div></div>`,
alerts:()=>`${top('Notifications')}<div class="body">${S.notes.length?`<button class="link" style="align-self:flex-start;text-decoration:none" data-act="readall">Mark all as read</button>`+S.notes.map(x=>`<div class="card ${x.read?'':'unread'}" style="display:flex;gap:12px;align-items:center"><span style="font-size:28px">${icon(x.text)}</span><div><p style="margin:0;color:var(--ink)">${esc(x.text)}</p><p class="meta">${String(x.created_at).slice(0,10)}</p></div></div>`).join(''):empty('No notifications yet.')}</div>`,
profile:()=>{const p=S.p,nm=p.full_name||'Resident';
 return `${top('Profile')}<div class="body"><div class="av">${esc(nm[0].toUpperCase())}</div><button class="btn alt sm" style="align-self:center" data-act="photo">📷 Add Photo</button><div style="text-align:center"><h3 style="color:var(--g1);font-size:20px">${esc(nm)}</h3><p class="sub">${esc(p.mobile)}</p></div><div class="card"><div class="li"><span>${staff()?'Role':'Resident Status'}</span><b>${staff()?'<span class="pill">Staff</span>':pOf(p)}</b></div><div class="li"><span>Barangay</span><b>Guinsorongan</b></div><div class="li"><span>Address</span><b>${esc(p.purok||'—')}</b></div></div><div class="card"><button class="li" style="width:100%;background:none;border:0;font:inherit;cursor:pointer" data-open="info"><span style="color:var(--ink)">Personal Information</span><span>›</span></button>${ui.open==='info'?`<p>Name: ${esc(p.full_name||'—')}</p><p>Mobile: ${esc(p.mobile)}</p><p>ID on file: ${esc(p.id_type||'—')}</p>`:''}<button class="li" style="width:100%;background:none;border:0;font:inherit;cursor:pointer" data-open="role"><span style="color:var(--ink)">My Role &amp; Permissions</span><span>›</span></button>${ui.open==='role'?`<p>${staff()?'Barangay staff: verify residents and update the status of complaints and certificate requests.':'Resident: file complaints and request certificates once your residency is verified.'}</p>`:''}</div><button class="btn" data-act="logout">Log Out</button></div>`},
org:()=>`${top('Organizational Chart',null,S.p?'profile':'welcome')}<div class="body"><div class="card" style="text-align:center"><h3 style="font-size:20px">Barangay Guinsorongan</h3><p>Catbalogan City, Samar</p></div><p class="h2">Barangay Council</p><div class="org">Roberto M. Villanueva<small>Punong Barangay</small></div><p class="cap">Sangguniang Barangay Members</p><div class="og">${ORG1.map(o=>`<div class="card"><b>${o[0]}</b><span>Barangay Kagawad<br>${o[1]}</span></div>`).join('')}</div><p class="h2">Sangguniang Kabataan (SK)</p><div class="org">Kyle Andrei Lim<small>SK Chairperson</small></div><p class="cap">SK Council Members</p><div class="og">${SKM.map(n=>`<div class="card"><b>${n}</b><span>SK Kagawad</span></div>`).join('')}</div><p class="cap">Appointed SK Officials</p><div class="og"><div class="card"><b>Bea Camille Ramos</b><span>SK Secretary</span></div><div class="card"><b>Dennis Paul Cabrera</b><span>SK Treasurer</span></div></div><p class="cap">SK Employees</p><div class="og"><div class="card"><b>Lorna D. Pineda</b><span>SK Employee<br>SK Clerk</span></div></div></div>`,
sverify:()=>`${top('Verify Residents',S.pend.length+' waiting')}<div class="body">${S.pend.length?S.pend.map(p=>`<div class="card"><h3>${esc(p.full_name||'Resident')}</h3><p>${esc(p.purok||'')} · ${esc(p.mobile)}</p><p>${esc(p.id_type||'')}: ${esc(p.id_number||'')}</p><div class="row" style="justify-content:flex-start;margin-top:10px"><button class="btn sm" data-appr="${p.id}">Approve</button><button class="btn sm bad" data-rej="${p.id}">Reject</button></div></div>`).join(''):empty('No residents are waiting for verification.')}</div>`,
sreqs:()=>`${top('All Requests',S.reqs.length+' total')}<div class="body">${S.reqs.length?S.reqs.map(r=>reqCard(r,true)).join(''):empty('No requests yet.')}</div>`
};
function render(){
 const s=ui.screen,tabs=staff()?ST:RT,tabbed=tabs.some(t=>t[0]===s);
 document.querySelectorAll('.tabs').forEach(x=>x.remove());
 $app.innerHTML=V[s]()+(tabbed?'<div style="flex:1"></div>':'');
 if(tabbed){const un=staff()?S.pend.length:S.notes.filter(x=>!x.read).length,bt=staff()?'sverify':'alerts';
  const bar=document.createElement('nav');bar.className='tabs';
  bar.innerHTML=tabs.map(t=>`<button class="tab ${s===t[0]?'on':''}" data-go="${t[0]}"><b>${t[1]}</b>${t[2]}${t[0]===bt&&un?`<span class="badge">${un}</span>`:''}</button>`).join('');
  $app.parentNode.insertBefore(bar,$t)}
 $app.scrollTop=0}
const FORMS={
 login:async d=>{const m=d.mobile.trim();
  if(!/^09\d{9}$/.test(m))return fail('Enter your 11-digit mobile number starting with 09.');
  const r=await sb.auth.signInWithPassword({phone:e164(m),password:d.pw});
  if(r.error)return fail(r.error.message==='Invalid login credentials'?'Mobile number or password is incorrect.':r.error.message);await enter(r.data.user)},
 register:async d=>{const m=d.mobile.trim();
  if(!/^09\d{9}$/.test(m))return fail('Enter an 11-digit mobile number starting with 09.');
  const r=await sb.auth.signUp({phone:e164(m),password:d.pw,options:{data:{mobile:m}}});
  if(r.error)return fail(/registered|exists/i.test(r.error.message)?'That mobile number already has an account. Log in instead.':r.error.message);
  if(r.data.session){await prep(r.data.user);go('residency');return toast('Account created. Now verify your residency.')}
  ui.tmp={phone:e164(m),mobile:m,mode:'signup'};go('otp');toast('We sent a 6-digit code to '+m)},
 otplogin:async d=>{const m=d.mobile.trim();
  if(!/^09\d{9}$/.test(m))return fail('Enter your 11-digit mobile number starting with 09.');
  const r=await sb.auth.signInWithOtp({phone:e164(m),options:{shouldCreateUser:false}});
  if(r.error)return fail(r.error.message);
  ui.tmp={phone:e164(m),mobile:m,mode:'login'};go('otp');toast('We sent a 6-digit code to '+m)},
 otp:async d=>{const r=await sb.auth.verifyOtp({phone:ui.tmp.phone,token:d.code.trim(),type:'sms'});
  if(r.error)return fail('That code didn’t work. Check it and try again, or ask for a new code.');
  if(ui.tmp.mode==='signup'){await prep(r.data.user);go('residency');return toast('Number verified. Now verify your residency.')}
  await enter(r.data.user)},
 residency:async d=>{const r=await sb.from('profiles').update({full_name:d.name.trim(),purok:d.purok+', '+d.street.trim(),status:'pending',id_type:d.idType,id_number:d.idNo}).eq('id',S.p.id);
  if(r.error)return fail(r.error.message);
  await notify(S.p.id,'Your residency verification was submitted. Staff will review it shortly.');await load();go('home');toast('Submitted for verification')},
 complaint:async d=>{const ref='CMP-'+new Date().getFullYear()+'-'+String(Math.floor(1000+Math.random()*9000));
  const r=await sb.from('requests').insert({ref,user_id:S.p.id,type:'Complaint',title:d.subject,detail:`${d.cat} at ${d.loc} (${d.date}). ${d.detail}`});
  if(r.error)return fail(/row-level/.test(r.error.message)?'Only verified residents can file requests.':r.error.message);
  await notify(S.p.id,`Complaint ${ref} received. Staff will review it.`);await load();go('reqs');toast('Complaint '+ref+' submitted')},
 certreq:async d=>{const ref='CLR-'+new Date().getFullYear()+'-'+String(Math.floor(1000+Math.random()*9000));
  const r=await sb.from('requests').insert({ref,user_id:S.p.id,type:'Clearance',title:ui.cert[0],detail:`Purpose: ${d.purpose}. Pickup: ${d.pickup}.`,status:'For Approval'});
  if(r.error)return fail(/row-level/.test(r.error.message)?'Only verified residents can file requests.':r.error.message);
  await notify(S.p.id,`${ui.cert[0]} request ${ref} is awaiting approval.`);await load();go('reqs');toast('Request '+ref+' submitted')}
};
const ACTS={
 resend:async()=>{const t=ui.tmp,r=t.mode==='signup'?await sb.auth.resend({type:'sms',phone:t.phone}):await sb.auth.signInWithOtp({phone:t.phone});toast(r.error?r.error.message:'A new code was sent')},
 forgot:async()=>toast('Please ask barangay staff to reset your password.'),
 photo:async()=>toast('Photo upload is coming soon.'),
 readall:async()=>{await sb.from('notifications').update({read:true}).eq('user_id',S.p.id).eq('read',false);await load();render()},
 logout:async()=>{await sb.auth.signOut();S={p:null,reqs:[],notes:[],pend:[]};go('welcome')}
};
async function decide(id,status,okMsg,note){const r=await sb.from('profiles').update({status}).eq('id',id);
 if(r.error)return toast(r.error.message);await notify(id,note);await load();render();toast(okMsg)}
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,d={};new FormData(f).forEach((v,k)=>d[k]=v);
 const b=f.querySelector('button');if(b){b.disabled=true;b.textContent='Please wait…'}
 try{await FORMS[f.dataset.form](d)}catch(x){fail(msg(x))}});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;document.getElementById('list').innerHTML=listHtml()}});
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-go],[data-act],[data-adv],[data-appr],[data-rej],[data-cert],[data-f],[data-open]');if(!t)return;
 const d=t.dataset;
 try{
 if(d.f){ui.filter=d.f;return render()}
 if(d.open){ui.open=ui.open===d.open?null:d.open;return render()}
 if(d.cert){ui.cert=CERTS[d.cert];return go('certreq')}
 if(d.go){const g=d.go;
  if(g==='soon')return toast('This service is coming soon.');
  if(S.p){
   if((g==='complaint'||g==='certs')&&S.p.status!=='verified')return toast('Verify your residency first. Tap Residency.');
   if(g==='residency'&&S.p.status==='verified')return toast('Your residency is already verified.');
   if(g==='residency'&&S.p.status==='pending')return toast('Your verification is still being reviewed.');
   if(['reqs','alerts','home','sverify','sreqs'].includes(g))await load()}
  return go(g)}
 if(d.act)return ACTS[d.act]();
 if(d.appr)return decide(d.appr,'verified','Resident approved','Your residency is verified. You can now file requests.');
 if(d.rej)return decide(d.rej,'rejected','Resident rejected','We couldn’t verify your residency. Check your details and submit again.');
 const r=S.reqs.find(x=>String(x.id)===d.adv),f=FLOW[r.type]||FLOW.Clearance,n=f[f.indexOf(r.status)+1];
 const u=await sb.from('requests').update({status:n}).eq('id',r.id);if(u.error)return toast(u.error.message);
 await notify(r.user_id,`${r.ref} is now: ${n}.`);await load();render();toast(`${r.ref} → ${n}`)
 }catch(x){toast(msg(x))}});
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&S.p&&!document.querySelector('form')&&!['splash'].includes(ui.screen)){await load();render()}});
render();boot();

}
show('Loading…');next(0);
})();
</script></body></html>
