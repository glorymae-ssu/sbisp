<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBISP - Smart Barangay Information and Service Portal</title>
<link rel="icon" href="logo.png"><link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#1F7A14;--g:linear-gradient(135deg,#1F6B12,#34A71C);--s:#E6F6E2;--bg:#FFFFFF;--er:#D32F2F;--wa:#E8890C;--mu:#66707D;--tx:#1B2430}
*{box-sizing:border-box;margin:0;font-family:Inter,Roboto,system-ui,sans-serif}
body{background:#E9F4E6;color:var(--tx)}
#app{max-width:480px;min-height:100vh;margin:auto;background:var(--bg);box-shadow:0 8px 30px #0003}
.wrap{padding:18px}.top{background:var(--g);color:#fff;padding:16px;display:flex;align-items:center;gap:10px}
.top h2{flex:1;font-size:18px}.top small{display:block;font-weight:600}.top button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
h1{color:var(--p);text-align:center;margin:6px 0}h2{color:var(--p)}p.muted,.muted{color:var(--mu);font-size:13px;margin:8px 0}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid #C5DCC0;border-radius:10px;font-size:15px;background:#fff}
textarea{min-height:80px}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:600;font-size:15px;margin-top:10px;cursor:pointer}
.btn.sec{background:var(--s);color:var(--p)}.btn.er{background:var(--er)}
.card{background:#F6FBF4;border:1px solid #DDEEDA;border-radius:12px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #E3EFE0;font-size:14px}.row span:first-child{color:var(--mu)}
.bd{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.bd.ok{background:#E3F5EA;color:#1E8E4E}.bd.wa{background:#FFF0DC;color:#B96A00}.bd.er{background:#FDE6E6;color:var(--er)}.bd.bl{background:var(--s);color:var(--p)}
.msg{padding:11px;border-radius:10px;font-size:13px;margin:10px 0;background:var(--s)}.msg.er{background:#FDE6E6}.msg.wa{background:#FFF0DC}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}.tabs button{padding:8px 13px;border:1px solid #D3E8CE;border-radius:99px;background:#fff;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--p);color:#fff}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}.item small{display:block;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.soon{opacity:.55;text-align:center;padding:16px 6px;font-weight:600}
a{color:var(--p)}
/* Staff screens (the ones with tabs) use the wider tablet and computer screens. Phones and the resident side are unchanged. */
@media(min-width:768px){
#app:has(.staff){max-width:1100px}
#app:has(.staff) .wrap{padding:24px 28px}
#app:has(.staff) .tabs{padding:12px 28px}
#app:has(.staff) input,#app:has(.staff) select,#app:has(.staff) textarea,#app:has(.staff) .btn{max-width:560px}
#ac-sum .card{max-width:480px}
#ac-list{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px;align-items:start}
}
@media(min-width:1000px){#ac-list{grid-template-columns:repeat(3,1fr)}}

/* Opening page (shown once per visit, then fades into the login screen) */
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 24px 8vh;
background:linear-gradient(180deg,#256A13 0%,#2F8F1B 45%,#3FC925 100%);color:#fff;font-family:Montserrat,Inter,system-ui,sans-serif;transition:opacity .6s}
#splash *{font-family:inherit}#splash.hide{opacity:0;pointer-events:none}
#splash img{width:min(52vw,210px);height:auto;margin-bottom:26px;filter:drop-shadow(0 6px 14px #0004)}
#splash h1{color:#fff;font-size:clamp(38px,11vw,54px);font-weight:800;letter-spacing:1px;margin:0 0 6px}
#splash .s1{font-size:clamp(16px,4.6vw,20px);font-weight:400;letter-spacing:.5px}
#splash .s2{font-size:clamp(11px,3vw,13px);font-weight:400;margin-top:2px}
#splash .s3{font-size:clamp(10px,2.8vw,12px);font-weight:400;margin-top:26px;line-height:1.5;max-width:340px}

/* Login page */
.lg{background:#F3F6F2;min-height:100vh}
.lg-hero{background:linear-gradient(180deg,#256A13,#3FC925);color:#fff;padding:56px 28px 34px;border-radius:0 0 22px 22px}
.lg-hero h1{color:#fff;text-align:left;font-size:34px;font-weight:800;margin:0}.lg-hero p{font-size:13px;margin-top:4px}
.lg-card{background:#fff;margin:30px 22px 0;border-radius:18px;padding:22px 20px;box-shadow:0 2px 10px #0001}
.lg-logo{display:block;width:76px;height:76px;margin:0 auto 12px}
.lg-card label{font-size:12px;font-weight:600;letter-spacing:.3px}
.lg-card input{background:#EDEDED;border:0;border-radius:14px;padding:15px}
.pw{position:relative}.pw input{padding-right:48px}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;color:#555;cursor:pointer}
.lg-fp{display:block;text-align:right;font-size:12px;font-weight:600;margin-top:8px;text-decoration:none}
.lg-card .btn{border-radius:99px;margin-top:16px}
.lg-or{display:flex;align-items:center;gap:10px;margin:22px 26px 14px;color:#666;font-size:12px}.lg-or:before,.lg-or:after{content:"";flex:1;height:1px;background:#C8CCC6}
.lg-reg{padding:0 26px 40px}.btn.out{background:#fff;color:#1B2430;border:1.5px solid #1B2430;border-radius:99px;font-weight:500}

/* Create Account (green screens, Canva pages 3 to 6) */
.ca{min-height:100vh;background:linear-gradient(180deg,#256A13 0%,#2F8F1B 50%,#3FC925 100%);color:#fff;padding:90px 30px 40px;font-family:Montserrat,Inter,system-ui,sans-serif}
.ca h1{color:#fff;font-size:38px;line-height:1.05;font-weight:800;text-align:center;margin:0}
.ca-sub{text-align:center;font-size:12px;margin:14px 0 30px}.ca-sub a{color:#fff;font-weight:700;text-decoration:underline}
.ca label{color:#fff;font-size:11px;letter-spacing:1.5px;font-weight:600;margin-top:14px;display:block}
.ca input{background:#ffffff55;border:0;border-radius:14px;padding:15px;color:#fff;width:100%;font-size:15px}
.ca input::placeholder{color:#ffffffcc}
.ca-btn{display:block;width:100%;margin-top:14px;padding:14px;border:1.5px solid #fff;border-radius:99px;background:transparent;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.ca-btn.ghost{border-color:#ffffff88;font-weight:400;font-size:13px}
.ca-ph{display:flex;gap:6px}.ca-ph span{background:#ffffff77;border-radius:14px;padding:15px 12px;font-size:15px}.ca-ph input{flex:1}
.ca-h{text-align:center;letter-spacing:2px;font-weight:600;font-size:12px;margin-top:22px}
.ca-i{text-align:center;font-size:12px;letter-spacing:.5px;margin:10px 0}
.ca .ca-code{text-align:center;letter-spacing:10px;background:transparent;border:1.5px solid #fff;border-radius:99px;font-size:20px}
.ca-err{background:#fff;color:#B3261E;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;font-weight:600}
/* Resident Registration (Canva pages 7 to 9) */
.rg{background:#F1F1F3;min-height:100vh}
.rg-top{background:#fff;display:flex;align-items:center;gap:12px;padding:16px 18px;color:#0B2A8A;font-weight:700;font-size:17px}.rg-top a{color:#0B2A8A;text-decoration:none;font-size:22px}
.rg-step{padding:14px 22px 8px;font-size:11px;color:#111}.rg-step b{color:#0B2A8A}.rg-step div:nth-child(2){font-weight:600;margin-top:2px}
.rg-bar{height:5px;background:#CFCFD4;border-radius:3px;margin-top:6px;overflow:hidden}.rg-bar i{display:block;height:100%;background:#18B04A}
.rg-body{padding:6px 16px 40px}
.rg-card{background:#fff;border-radius:14px;padding:12px 14px 16px;margin-bottom:16px}
.rg-card label{font-size:10.5px;letter-spacing:1.3px;color:#555;font-weight:500;margin-top:12px;display:block}.rg-card label em{font-style:italic}
.rg-card input:not([type=radio]):not([type=checkbox]),.rg-card select{background:#EDEDED;border:0;border-radius:6px;padding:11px 12px;font-size:14px}
.rg-ph{display:flex;gap:6px}.rg-ph span{background:#EDEDED;border-radius:6px;padding:11px 10px;font-size:14px}.rg-ph input{flex:1}
.rg-card .rg-radio{display:flex;align-items:center;gap:10px;background:#EDEDED;border-radius:6px;padding:11px 12px;margin-top:8px;font-size:13px;letter-spacing:0;color:#222}.rg-radio input{width:auto;margin:0}
.rg-note{background:#D7F1F7;border-radius:6px;color:#14506B;font-size:12px;padding:10px 12px;margin-top:14px}
.rg-h{font-size:11px;letter-spacing:1.5px;font-weight:700;color:#0B2A8A;margin-top:20px;padding-top:12px;border-top:1px solid #E3E3E3}
.rg-drop{background:#FFF2A8;border:1.5px dashed #E4B800;border-radius:16px;text-align:center;padding:22px 12px;font-size:12px;color:#146B14;cursor:pointer;margin-top:6px}
.rg-card .rg-consent{display:flex;gap:10px;align-items:flex-start;background:#D7F1F7;border-radius:6px;color:#14506B;font-size:12px;letter-spacing:0;padding:12px;margin-top:16px;line-height:1.4}.rg-consent input{width:auto;margin-top:2px}
.btn.out2{background:#fff;color:#0B2A8A;border:1.5px solid #0B2A8A;border-radius:10px;font-weight:700}
.rg .btn{border-radius:10px;margin-top:10px}
/* Organizational structure and the link to it */
.lg-org{text-align:center;font-size:13px;padding:0 26px 40px;margin-top:-22px}.lg-org a{font-weight:600}
.og-g{font-weight:800;color:var(--p);font-size:14px;letter-spacing:1px;margin:22px 0 10px;text-transform:uppercase}
.og-top{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.og-line{width:2px;height:16px;background:#9CCB92;margin:0 auto}
.og-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.og-card{background:#fff;border:1px solid #D6E9D2;border-radius:12px;padding:12px 10px;text-align:center}
.og-card b{display:block;font-size:14px}.og-card small{display:block;color:#555;font-size:11.5px;margin-top:3px}
.og-card.big{background:linear-gradient(135deg,#1F6B12,#34A71C);border:0;min-width:170px}.og-card.big b,.og-card.big small{color:#fff}
.og-card small.cm{color:#1F7A14;font-weight:600;font-style:italic}.og-card.big small.cm{color:#fff}
.tbd{color:#9AA29A;font-weight:500;font-style:italic}.og-card.big .tbd{color:#ffffffcc}

/* Green header, Quick Actions tiles and bottom navigation (Canva page 10), used by residents and staff */
.top h2,.top h2 small{color:#fff}
.hdr{background:linear-gradient(135deg,#1F6B12,#34B21C);color:#fff;padding:18px 18px 20px;border-radius:0 0 22px 22px}
.hdr-row{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:#fff;color:#1F7A14;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.hdr-t{flex:1;min-width:0}.hdr-t b{display:block;color:#fff;font-size:18px;font-weight:700}.hdr-t span{display:block;color:#fff;font-size:13px}
.hdr button{background:none;border:0;color:#fff;cursor:pointer;position:relative;padding:6px}
.dot{position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:#E53935;border:2px solid #fff}
.srch{position:relative;margin-top:14px}.srch input{border:0;border-radius:10px;padding:13px 44px 13px 14px;background:#fff;font-style:italic}.srch svg{position:absolute;right:14px;top:50%;transform:translateY(-50%)}
.qa-h{font-weight:700;color:#0B2A8A;font-size:14px;margin:18px 4px 10px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa-t{background:#fff;border:1px solid #DDEEDA;border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 4px #0001;font-family:inherit}
.qa-i{width:42px;height:42px;border-radius:50%;background:#EEF3EC;display:flex;align-items:center;justify-content:center}.qa-l{font-size:13px;font-weight:600}
.banner{background:#FFF6D6;border:1px solid #F0DD8B;border-radius:12px;padding:14px;margin-top:16px}.banner.ok{background:#E6F6E2;border-color:#BFE3B7}.banner p{margin:4px 0 10px;font-size:13px}
.bn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #E3EFE0;display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
.bn button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#222;cursor:pointer;font-family:inherit}.bn button.on{color:#1F7A14;font-weight:700}
.res-pad{padding-bottom:96px}.org-link{text-align:center;font-size:13px;margin:18px 0}
.staff .sec-h{margin:8px 0 6px;color:#0B2A8A}
@media(min-width:768px){.staff .qa{grid-template-columns:repeat(4,1fr)}}

/* Figma pages: white page header, My Profile, Manage Complaints */
.pg-h{background:#fff;border-bottom:1px solid #E3E6EA;padding:20px 18px 14px;display:flex;align-items:center;justify-content:space-between}
.pg-h b{font-size:21px;font-weight:700}.pg-h a{font-size:14px;font-weight:700;text-decoration:none;color:#1565C0}
.pf-card{background:#fff;border:1px solid #E8ECEF;border-radius:18px;padding:22px 16px;text-align:center;box-shadow:0 1px 3px #0001}
.pf-av{width:78px;height:78px;border-radius:50%;background:#E3F0FF;color:#1565C0;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.pf-n{font-size:20px;font-weight:800}.pf-s{color:#1565C0;font-size:14px;margin-top:2px}.pf-a{color:#666;font-size:12.5px;margin-top:3px}
.pf-fields{background:#fff;border:1px solid #E8ECEF;border-radius:16px;padding:2px 16px;margin:14px 0}
.pf-fields>div{padding:12px 0;border-bottom:1px solid #E6E8EB}.pf-fields>div:last-child{border-bottom:0}
.pf-fields small{display:block;font-size:11px;letter-spacing:.4px;color:#555;margin-bottom:3px}.pf-fields span{display:block;font-size:15px;color:#111}
.btn.bl{background:#fff;color:#1565C0;border:1.5px solid #1565C0;border-radius:12px;font-weight:700}
.btn.gy{background:#fff;color:#666;border:1.5px solid #888;border-radius:12px;font-weight:700}
.btn.rd{background:#FDE8EA;color:#C62828;border:1.5px solid #D32F2F;border-radius:12px;font-weight:700}
.cp-bar{display:flex;gap:10px}.cp-s{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #D9DEE3;border-radius:12px;padding:0 12px}
.cp-s input{border:0;background:none;padding:13px 0;min-width:0}.cp-fb{width:52px;border:0;border-radius:12px;background:#2BB52F;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cp-flt{display:flex;gap:8px;margin-top:10px}.cp-chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0}
.cp-chips button{border:1px solid #D9DEE3;background:#fff;border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
.cp-chips button.on{background:#2BB52F;border-color:#2BB52F;color:#fff;font-weight:700}
.cp-card{background:#fff;border:1px solid #E2E6EA;border-radius:14px;padding:14px;margin:12px 0;cursor:pointer}.cp-card.open{border:2px solid #2BB52F}
.cp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.cp-top b{color:#1B8A2E;font-size:15.5px}
.cp-card p{margin:8px 0;font-size:14px;line-height:1.4}
.cp-chip{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:6px;white-space:nowrap}.cp-chip.pd{background:#FFF1DC;color:#E65100}.cp-chip.og{background:#E2F6E0;color:#1B7A1B}.cp-chip.rs{background:#E3F0FF;color:#1565C0}
.cp-as{color:#1565C0;font-weight:600;font-size:12px}.cp-un{color:#E65100;font-weight:800;font-size:11px}
.cp-foot{display:flex;justify-content:space-between;border-top:1px solid #E6E8EB;margin-top:10px;padding-top:10px;font-size:12px;color:#666}.cp-chev{color:#1B8A2E;font-weight:800}
.cp-pn{background:#F5F6F7;border-radius:10px;padding:12px;margin-top:10px;cursor:default}.cp-r{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}
.cp-r span{font-size:11.5px;font-weight:700;letter-spacing:.4px;color:#555}.cp-r select{width:auto;max-width:62%;padding:7px 10px;border-radius:8px}
.cp-pn textarea{background:#fff;border-radius:8px}
.cp-g{display:block;width:100%;border:0;border-radius:10px;background:#27C227;color:#fff;font-weight:700;font-size:14.5px;padding:13px;margin-top:10px;cursor:pointer;font-family:inherit}.cp-g.sec{background:#fff;color:#1B8A2E;border:1.5px solid #27C227}
.cp-form{background:#fff;border:1px solid #E8ECEF;border-radius:14px;padding:6px 14px 14px;margin-top:10px}.cp-form label{font-size:11px;letter-spacing:.4px;color:#555;font-weight:600;margin-top:12px;display:block}

/* Barangay Services */
.cp-chip.fr{background:#FFF1DC;color:#E65100}.cp-chip.rc{background:#E2F6E0;color:#1B7A1B}.cp-chip.rl{background:#E3F0FF;color:#1565C0}.cp-chip.rj{background:#FDE8EA;color:#C62828}
.cp-chip.un{background:#FFF1DC;color:#E65100}.cp-chip.as{background:#E3F0FF;color:#1565C0}
.sv-card{position:relative;background:#fff;border:1px solid #DDEAF7;border-radius:16px;padding:16px 40px 16px 16px;margin:12px 0;cursor:pointer;box-shadow:0 1px 3px #0001}
.sv-i{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.sv-card b{display:block;font-size:17px}.sv-card small{display:block;color:#666;font-size:13px;margin-top:3px}.sv-card small.sv-fee{color:#1B7A1B;font-weight:600}
.sv-go{position:absolute;right:16px;bottom:12px;font-size:22px}
.sv-note{background:#E4F4E1;border:1px solid #CBE7C6;border-radius:10px;padding:12px;font-size:13px;margin:10px 0}.sv-info{background:#E3F0FF;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#14506B;margin-top:12px}
/* Analytics dashboard */
.an-range{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px}.an-range span{font-size:12px;font-weight:700;letter-spacing:.5px;color:#444}.an-range select{width:auto;padding:7px 12px;border-radius:99px;color:#1B8A2E;font-weight:600}
.an-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.an-kpis>div{background:#fff;border:1px solid #E2E6EA;border-radius:12px;padding:10px 6px;text-align:center}.an-kpis b{display:block;font-size:22px}.an-kpis small{color:#666;font-size:11px}
.an-card{background:#fff;border:1px solid #E2E6EA;border-radius:14px;padding:14px;margin:12px 0}.an-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.an-d{font-size:11.5px;font-weight:700;color:#1B8A2E}
.an-don{display:flex;align-items:center;gap:14px;margin-top:8px}.an-leg{font-size:12.5px}.an-leg div{display:flex;align-items:center;gap:7px;margin:4px 0}.an-leg i{width:11px;height:11px;border-radius:2px;display:inline-block}
.an-bar{margin-top:12px}.an-bl{display:flex;justify-content:space-between;font-size:12.5px}.an-bt{height:7px;background:#E9EDF0;border-radius:99px;margin-top:5px;overflow:hidden}.an-bt div{height:100%;background:#27C227;border-radius:99px}
.an-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.an-two .an-card{margin:0}.an-two small{font-size:11px;font-weight:700;letter-spacing:.4px;color:#444}.an-big{display:flex;align-items:center;gap:10px;margin-top:8px}.an-big b{font-size:21px}
/* Staff home: summary and alerts */
.ss{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ss>div{border-radius:12px;padding:12px;border:1.5px solid}.ss b{display:block;font-size:26px}.ss small{font-size:12px}
.ss-p{background:#FFF6EA;border-color:#F6C98B;color:#B45309}.ss-o{background:#EAF7E8;border-color:#A9DDA2;color:#1B6B1B}.ss-r{background:#E8F2FF;border-color:#A8CBF5;color:#1565C0}
.new-pill{background:#C62828;color:#fff;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:5px}.qa-h{display:flex;justify-content:space-between;align-items:center}
.al{cursor:pointer}
/* Residency classification */
